<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ConnectVeneto — Grafos de Arquitetura</title>
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #0f1923; color: #e0e0e0; }
    .header { background: #0d1d2c; padding: 20px 32px; border-bottom: 2px solid #2d58a5; display: flex; align-items: center; gap: 16px; }
    .header h1 { font-size: 22px; color: #e1ca5f; font-weight: 700; }
    .header span { color: #a9a9a8; font-size: 14px; }
    .tabs { display: flex; gap: 4px; padding: 12px 32px; background: #141f2b; border-bottom: 1px solid #1e3045; flex-wrap: wrap; }
    .tab { padding: 10px 20px; border-radius: 8px 8px 0 0; cursor: pointer; font-size: 13px; font-weight: 600; color: #a9a9a8; background: transparent; border: 1px solid transparent; transition: all 0.2s; }
    .tab:hover { color: #e1ca5f; background: #1a2a3a; }
    .tab.active { color: #e1ca5f; background: #0d1d2c; border-color: #2d58a5; border-bottom-color: #0d1d2c; }
    .graph-container { width: 100%; height: calc(100vh - 140px); background: #0d1d2c; }
    .legend { position: fixed; bottom: 16px; right: 16px; background: rgba(13,29,44,0.95); border: 1px solid #2d58a5; border-radius: 10px; padding: 16px; font-size: 12px; max-width: 260px; z-index: 10; }
    .legend h3 { color: #e1ca5f; margin-bottom: 8px; font-size: 13px; }
    .legend-item { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
    .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .info-panel { position: fixed; top: 120px; right: 16px; background: rgba(13,29,44,0.95); border: 1px solid #2d58a5; border-radius: 10px; padding: 16px; font-size: 12px; max-width: 300px; z-index: 10; display: none; }
    .info-panel h3 { color: #e1ca5f; margin-bottom: 8px; }
    .info-panel .close { position: absolute; top: 8px; right: 12px; cursor: pointer; color: #a9a9a8; font-size: 16px; }
    .badge-critical { background: #dc2626; color: white; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; }
    .badge-high { background: #f59e0b; color: #1a1a1a; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; }
    .badge-medium { background: #3b82f6; color: white; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; }
  </style>
</head>
<body>

<div class="header">
  <h1>ConnectVeneto — Arquitetura</h1>
  <span>Grafos interativos | Arraste os nós, use scroll para zoom</span>
</div>

<div class="tabs" id="tabs">
  <div class="tab active" onclick="showGraph('arch')">Arquitetura Geral</div>
  <div class="tab" onclick="showGraph('auth')">Fluxo de Auth</div>
  <div class="tab" onclick="showGraph('data')">Fluxo de Dados</div>
  <div class="tab" onclick="showGraph('providers')">Árvore de Providers</div>
  <div class="tab" onclick="showGraph('permissions')">Permissões e Rotas</div>
  <div class="tab" onclick="showGraph('failures')">Pontos de Falha</div>
</div>

<div class="graph-container" id="graph"></div>

<div class="legend" id="legend"></div>
<div class="info-panel" id="info-panel">
  <span class="close" onclick="document.getElementById('info-panel').style.display='none'">&times;</span>
  <h3 id="info-title"></h3>
  <div id="info-body"></div>
</div>

<script>
let network = null;
const container = document.getElementById('graph');

const COLORS = {
  blue: '#2d58a5',
  darkBlue: '#0d1d2c',
  gold: '#e1ca5f',
  gray: '#a9a9a8',
  green: '#10b981',
  red: '#ef4444',
  orange: '#f59e0b',
  purple: '#8b5cf6',
  cyan: '#06b6d4',
  pink: '#ec4899',
  white: '#ffffff',
  lime: '#84cc16',
  teal: '#14b8a6',
  rose: '#f43f5e',
  amber: '#f59e0b',
  indigo: '#6366f1',
};

const defaultOptions = {
  physics: {
    forceAtlas2Based: { gravitationalConstant: -40, centralGravity: 0.005, springLength: 150, springConstant: 0.06, damping: 0.4 },
    solver: 'forceAtlas2Based',
    stabilization: { iterations: 200 },
  },
  interaction: { hover: true, tooltipDelay: 100, zoomView: true, dragView: true },
  nodes: {
    font: { color: '#e0e0e0', size: 13, face: 'Segoe UI', strokeWidth: 2, strokeColor: '#0d1d2c' },
    borderWidth: 2,
    shadow: { enabled: true, color: 'rgba(0,0,0,0.3)', size: 8 },
  },
  edges: {
    color: { color: '#2d58a555', highlight: '#e1ca5f', hover: '#2d58a5' },
    width: 1.5,
    smooth: { type: 'continuous' },
    font: { color: '#a9a9a8', size: 10, strokeWidth: 2, strokeColor: '#0d1d2c' },
  },
};

function n(id, label, color, shape='dot', size=20, extra={}) {
  return { id, label, color: { background: color, border: color, highlight: { background: COLORS.gold, border: COLORS.gold } }, shape, size, ...extra };
}

function e(from, to, label='', dashes=false, width=1.5, color=null) {
  const edge = { from, to, label, dashes, width };
  if (color) edge.color = { color, highlight: COLORS.gold, hover: color };
  return edge;
}

// ========== RENDER ==========
const graphs = { arch: graphArch, auth: graphAuth, data: graphData, providers: graphProviders, permissions: graphPermissions, failures: graphFailures };

function setLegend(items) {
  document.getElementById('legend').innerHTML = '<h3>Legenda</h3>' + items.map(i =>
    `<div class="legend-item"><div class="legend-dot" style="background:${i.color}"></div><span>${i.label}</span></div>`
  ).join('');
}

function showGraph(key) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('info-panel').style.display = 'none';

  const { nodes, edges } = graphs[key]();
  if (network) network.destroy();
  network = new vis.Network(container, { nodes, edges }, defaultOptions);

  network.on('click', (params) => {
    if (params.nodes.length > 0) {
      const nodeId = params.nodes[0];
      const node = nodes.get(nodeId);
      if (node) {
        document.getElementById('info-title').textContent = node.label.replace(/\n/g, ' ');
        document.getElementById('info-body').innerHTML = `<p style="color:#a9a9a8">ID: <code>${node.id}</code></p>`;
        document.getElementById('info-panel').style.display = 'block';
      }
    }
  });
}

showGraph('arch');
