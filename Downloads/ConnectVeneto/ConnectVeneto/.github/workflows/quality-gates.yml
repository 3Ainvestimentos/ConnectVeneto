name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality-gates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (strict)
        run: npm run lint

      - name: Typecheck gate (baseline-aware)
        run: npm run typecheck:gate

      - name: Tests
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: Dependency audit (high+critical)
        # Bloqueia o pipeline se houver vulnerabilidades de severidade high ou critical.
        # A dependência residual "xlsx" (2 advisories high sem fix disponível) deve ser
        # migrada para "exceljs" ou gerenciada com "npm audit --ignore" explícito quando disponível.
        run: npm audit --audit-level=high --omit=dev

